name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A real PostgreSQL and a real Redis for the integration tests.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: slotguard
          POSTGRES_PASSWORD: slotguard
          POSTGRES_DB: slotguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slotguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SLOTGUARD_TEST_DATABASE_URL: postgres://slotguard:slotguard@localhost:5432/slotguard?sslmode=disable
      SLOTGUARD_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test -race ./...
